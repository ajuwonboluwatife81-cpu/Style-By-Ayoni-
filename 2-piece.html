<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two Piece Sets | Style by Ayoni</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- CLIENT GALLERY -->

    <section class="client-gallery">


        <h1>Two Piece Sets</h1>


        <div class="gallery">


            <!-- TWO PIECE 1, 2 & 3 -->

            <div class="gallery-item">

                <div class="three-photo-hover">


                    <img
                        src="images/twopiece2.jpeg"
                        alt="Style by Ayoni Two Piece Set 2"
                        class="photo-main">


                    <img
                        src="images/twopiece1.jpeg"
                        alt="Style by Ayoni Two Piece Set 1"
                        class="photo-left">


                    <img
                        src="images/twopiece3.jpeg"
                        alt="Style by Ayoni Two Piece Set 3"
                        class="photo-right">


                </div>

            </div>



            <!-- TWO PIECE 4 & 5 -->

            <div class="gallery-item">

                <div class="swap-photo">


                    <img src="images/twopiece4.JPEG"
     alt="Style by Ayoni Two Piece Set 4"
     class="front-photo">

<img src="images/twopiece5.JPEG"
     alt="Style by Ayoni Two Piece Set 5"
     class="back-photo">


                </div>

            </div>



            <!-- TWO PIECE 6 & 7 -->

            <div class="gallery-item">

                <div class="swap-photo">


                    <img src="images/twopiece6.JPEG"
     alt="Style by Ayoni Two Piece Set 6"
     class="front-photo">

<img src="images/twopiece7.JPEG"
     alt="Style by Ayoni Two Piece Set 7"
     class="back-photo">


                </div>

            </div>


        </div>



        <!-- BACK TO CLIENT GALLERY -->

        <a href="gallery.html" class="btn">

            Back to Client Gallery

        </a>


    </section>

</html>
